<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF STORE ADMIN | لوحة التحكم</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --fire: #ff4b2b; --gold: #ffcc00; --dark: #0d1117; }
        body { margin: 0; background-color: var(--dark); color: white; font-family: 'Cairo', sans-serif; }
        .admin-header { background: linear-gradient(to left, #161b22, var(--fire)); padding: 20px; text-align: center; border-bottom: 3px solid var(--gold); }
        .container { max-width: 900px; margin: 20px auto; padding: 15px; }
        .card { background: #161b22; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #30363d; }
        input { padding: 12px; margin: 5px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: white; width: 220px; }
        .btn-topup { background: var(--gold); color: black; border: none; padding: 12px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th { background: #21262d; padding: 15px; border: 1px solid #30363d; color: var(--gold); }
        td { padding: 15px; border: 1px solid #30363d; text-align: center; }
        .uid-box { background: #0d1117; color: var(--gold); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-family: monospace; border: 1px solid #333; }
        .type-tag { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .tag-gems { background: #4ade80; color: black; }
        .tag-acc { background: #60a5fa; color: white; }
        .status-badge { color: #8b949e; font-size: 12px; }
    </style>
</head>
<body>

<div class="admin-header">
    <h2 style="margin:0;">🎖️ غرفة عمليات FF STORE</h2>
    <div id="status" class="status-badge">جاري فحص الرادار...</div>
</div>

<div class="container">
    <div class="card">
        <h3 style="margin-top:0; color: var(--gold);">💳 شحن رصيد المحفظة</h3>
        <p style="font-size: 13px; color: #8b949e;">ضع الـ UID الخاص باللاعب والمبلغ لإضافة الرصيد فوراً.</p>
        <div style="display: flex; flex-wrap: wrap; gap: 10px;">
            <input type="text" id="target-uid" placeholder="أدخل UID اللاعب">
            <input type="number" id="topup-amount" placeholder="المبلغ بالجنيه (ج.س)">
            <button class="btn-topup" onclick="addMoney()">تأكيد الشحن ✅</button>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-top:0; color: var(--fire);">📥 طلبات الشحن والحسابات الحالية</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>إيميل اللاعب</th>
                        <th>النوع</th>
                        <th>التفاصيل</th>
                        <th>الـ UID (نسخ)</th>
                        <th>الإجراء</th>
                    </tr>
                </thead>
                <tbody id="orders-list"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // إعدادات Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCwb4HhEtQyzdlya4L85Wk1pgLlj8_n_jc",
        authDomain: "ffstore-a008a.firebaseapp.com",
        databaseURL: "https://ffstore-a008a-default-rtdb.firebaseio.com",
        projectId: "ffstore-a008a",
        storageBucket: "ffstore-a008a.firebasestorage.app",
        messagingSenderId: "993784923560",
        appId: "1:993784923560:web:b3933cef1bf4661188099d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // فحص الاتصال
    db.ref('.info/connected').on('value', (snap) => {
        const status = document.getElementById('status');
        if (snap.val() === true) {
            status.innerText = "● متصل بالرادار - الأنظمة تعمل";
            status.style.color = "#4ade80";
        } else {
            status.innerText = "○ انقطع الاتصال - جاري المحاولة...";
            status.style.color = "#f87171";
        }
    });

    // إضافة رصيد
    async function addMoney() {
        const uid = document.getElementById('target-uid').value.trim();
        const amount = parseInt(document.getElementById('topup-amount').value);
        if(!uid || !amount) return alert("أدخل البيانات!");

        const ref = db.ref('wallets/' + uid);
        const snap = await ref.once('value');
        const currentBal = snap.val() || 0;
        await ref.set(currentBal + amount);
        alert(`تم شحن ${amount} ج.س بنجاح!`);
        document.getElementById('topup-amount').value = '';
    }

    // عرض الطلبات وتحديثها تلقائياً
    db.ref('orders').on('value', (snapshot) => {
        const list = document.getElementById('orders-list');
        list.innerHTML = '';
        snapshot.forEach((child) => {
            const data = child.val();
            const key = child.key;
            const typeLabel = data.type === "جواهر" 
                ? `<span class="type-tag tag-gems">💎 جواهر</span>`
                : `<span class="type-tag tag-acc">🎮 حساب</span>`;
            const detail = data.type === "جواهر" ? data.amount + " جوهرة" : "مستوى " + data.level;

            list.innerHTML += `
                <tr>
                    <td>${data.email}</td>
                    <td>${typeLabel}</td>
                    <td>${detail}</td>
                    <td><span class="uid-box" onclick="copyUID('${data.uid}')">${data.uid}</span></td>
                    <td><button onclick="completeOrder('${key}', '${data.uid}')" style="background:#4ade80; border:none; padding:8px; color:black; border-radius:4px; cursor:pointer; font-weight:bold;">تم التنفيذ</button></td>
                </tr>
            `;
        });
    });

    // تنفيذ الطلب وإرسال إشعار للمستخدم وحذفه من القائمة
    function completeOrder(orderKey, userUID) {
        if(confirm("هل تم الشحن؟ سيتم إخطار اللاعب وحذف الطلب.")) {
            // إرسال إشعار النجاح للمستخدم
            db.ref('notifications/' + userUID).set({
                status: "completed",
                timestamp: Date.now()
            }).then(() => {
                // حذف الطلب من قائمة المدير
                db.ref('orders/' + orderKey).remove();
                alert("تم إخطار اللاعب وحذف الطلب بنجاح! ✅");
            });
        }
    }

    function copyUID(text) {
        navigator.clipboard.writeText(text);
        alert("تم نسخ الـ UID بنجاح!");
    }
</script>
</body>
</html>
