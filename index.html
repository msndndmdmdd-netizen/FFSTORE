<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF STORE | متجر المحاربين</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        :root { --fire: #ff4b2b; --gold: #ffcc00; --bg: #0b0e14; --card: #161b22; }
        body {
            margin: 0; background-color: var(--bg); color: white; font-family: 'Cairo', sans-serif;
            background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://wallpaperaccess.com/full/1192102.jpg');
            background-size: cover; background-attachment: fixed; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .main-container { width: 95%; max-width: 420px; background: rgba(22, 27, 34, 0.98); padding: 25px; border-radius: 20px; border-top: 4px solid var(--fire); box-shadow: 0 15px 35px rgba(0,0,0,0.8); text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.3s; font-size: 16px; text-decoration: none; display: block; }
        .btn-fire { background: linear-gradient(45deg, #ff4b2b, #ff416c); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--fire); color: var(--fire); }
        .wallet-card { background: #0d1117; padding: 15px; border-radius: 12px; margin: 15px 0; border: 1px dashed var(--gold); }
        .hidden { display: none; }
        .item-row { display: flex; justify-content: space-between; align-items: center; background: #1c2128; padding: 12px; margin: 8px 0; border-radius: 8px; border-right: 4px solid var(--gold); }
        .buy-btn { background: var(--fire); color: white; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; }
        #notif-box { background: #23d366; color: white; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div class="main-container">
    <div id="notif-box">✅ مبروك! تم تنفيذ طلبك بنجاح.</div>

    <h1 style="color: var(--fire); margin-bottom: 5px; letter-spacing: 2px;">FF STORE</h1>
    <p style="color: #8b949e; font-size: 13px; margin-bottom: 25px;">الشحن الرسمي والآمن في السودان 🇸🇩</p>

    <div id="auth-screen">
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button class="btn btn-fire" onclick="handleAuth('login')">تسجيل الدخول</button>
        <button class="btn btn-outline" onclick="handleAuth('register')">إنشاء حساب جديد</button>
    </div>

    <div id="shop-screen" class="hidden">
        <div class="wallet-card">
            <small>كود الشحن (UID):</small>
            <div id="user-uid" style="color: var(--gold); font-weight: bold;">جاري التحميل...</div>
            <hr style="border: 0.1px solid #30363d;">
            <small>الرصيد:</small>
            <div style="font-size: 24px;"><span id="balance">0</span> ج.س</div>
        </div>

        <div style="text-align: right;">
            <h3 style="color: var(--fire); font-size: 16px;">💎 عروض الجواهر</h3>
            <div class="item-row"><span>110 جوهرة</span> <b>3,800 ج.س</b> <button class="buy-btn" onclick="order('جواهر', 110, 3800)">شراء</button></div>
            <div class="item-row"><span>231 جوهرة</span> <b>7,600 ج.س</b> <button class="buy-btn" onclick="order('جواهر', 231, 7600)">شراء</button></div>

            <h3 style="color: var(--fire); font-size: 16px; margin-top: 20px;">🎮 حسابات جاهزة</h3>
            <div class="item-row"><span>حساب ليفل 40-50</span> <button class="buy-btn" style="background:#23d366;" onclick="askAccount('40-50')">استفسار</button></div>
        </div>

        <a href="https://wa.me/249996103758" class="btn" style="background: #23d366; color: white;">شحن المحفظة عبر الواتساب</a>
        <button onclick="firebase.auth().signOut()" style="background:none; border:none; color:#555; cursor:pointer; margin-top:20px;">تسجيل الخروج</button>
    </div>
</div>

<script>
    // الإعدادات
    const firebaseConfig = {
        apiKey: "AIzaSyCwb4HhEtQyzdlya4L85Wk1pgLlj8_n_jc",
        authDomain: "ffstore-a008a.firebaseapp.com",
        databaseURL: "https://ffstore-a008a-default-rtdb.firebaseio.com",
        projectId: "ffstore-a008a",
        storageBucket: "ffstore-a008a.firebasestorage.app",
        messagingSenderId: "993784923560",
        appId: "1:993784923560:web:b3933cef1bf4661188099d"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // مراقبة حالة المستخدم
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('shop-screen').classList.remove('hidden');
            document.getElementById('user-uid').innerText = user.uid;
            
            // تحديث الرصيد لحظياً
            db.ref('wallets/' + user.uid).on('value', s => { 
                document.getElementById('balance').innerText = (s.val() || 0).toLocaleString(); 
            });

            // مراقبة الإشعارات
            watchOrders(user.uid);
        } else {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('shop-screen').classList.add('hidden');
        }
    });

    async function handleAuth(type) {
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value;
        if(!email || pass.length < 6) return alert("البيانات غير مكتملة أو كلمة المرور ضعيفة");
        try {
            if(type === 'login') await auth.signInWithEmailAndPassword(email, pass);
            else await auth.createUserWithEmailAndPassword(email, pass);
        } catch (e) { alert("خطأ: " + e.message); }
    }

    async function order(type, detail, price) {
        const user = auth.currentUser;
        const snap = await db.ref('wallets/' + user.uid).once('value');
        const bal = snap.val() || 0;
        
        if(bal >= price) {
            if(confirm(`تأكيد شراء ${detail}؟`)) {
                await db.ref('wallets/' + user.uid).set(bal - price);
                await db.ref('orders').push({
                    email: user.email, uid: user.uid, type: type, amount: detail, date: new Date().toLocaleString()
                });
                alert("تم إرسال طلبك!");
            }
        } else { alert("الرصيد غير كافٍ!"); }
    }

    function askAccount(level) {
        const user = auth.currentUser;
        const msg = `السلام عليكم، أود الاستفسار عن حساب ليفل ${level}. الـ UID الخاص بي: ${user ? user.uid : 'غير مسجل'}`;
        window.open(`https://wa.me/249996103758?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function watchOrders(uid) {
        db.ref('notifications/' + uid).on('value', (snapshot) => {
            if (snapshot.val() && snapshot.val().status === "completed") {
                const box = document.getElementById('notif-box');
                box.style.display = 'block';
                setTimeout(() => { box.style.display = 'none'; db.ref('notifications/' + uid).remove(); }, 10000);
            }
        });
    }
</script>
</body>
</html>
